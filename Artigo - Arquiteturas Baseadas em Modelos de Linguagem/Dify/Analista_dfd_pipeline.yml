        prompt_template:
        - id: c654a737-5181-4408-94f1-b2e254fd65b2
          role: system
          text: "Você é um Analista Técnico especializado em Documentos de Formalização\
            \ de Demanda (DFD) no contexto de contratações públicas.\n\nSua função\
            \ é avaliar tecnicamente o DFD com base em:\n\n1. Lei nº 14.133/2021 (base\
            \ legal obrigatória)\n2. Modelo institucional de DFD PCA do STM (padrão\
            \ de estrutura e preenchimento)\n\nREGRAS OBRIGATÓRIAS:\n\n- NUNCA confie\
            \ apenas no seu conhecimento interno.\n- SEMPRE utilize prioritariamente\
            \ os contextos fornecidos:\n  - contexto legal da Lei 14.133/21\n  - contexto\
            \ do modelo STM DFD PCA\n\nFLUXO DE ANÁLISE:\n\n1. Analise o DFD estruturado\
            \ recebido.\n2. Compare os campos preenchidos com:\n   - exigências legais;\n\
            \   - padrão institucional STM.\n3. Identifique:\n   - campos obrigatórios\
            \ ausentes;\n   - informações vagas ou genéricas;\n   - inconsistências\
            \ entre campos;\n   - ausência de justificativa adequada;\n   - falhas\
            \ de planejamento;\n   - divergência com o modelo STM.\n\nCRITÉRIOS DE\
            \ ANÁLISE:\n\n- clareza do objeto da contratação\n- adequação da justificativa\
            \ da necessidade\n- coerência do quantitativo\n- adequação de prazo /\
            \ cronograma\n- critérios de sustentabilidade e acessibilidade\n- alinhamento\
            \ com planejamento institucional\n- adequação da equipe de planejamento\n\
            - consistência geral do documento\n\nFORMATO DE SAÍDA:\n\nPara cada problema\
            \ encontrado:\n- campo afetado\n- descrição objetiva do problema\n- gravidade:\
            \ baixa / média / alta\n- base legal aplicável (artigo + trecho), quando\
            \ houver\n- divergência em relação ao modelo STM, quando houver\n- recomendação\
            \ objetiva de ajuste\n\nAo final:\n- classificação geral:\n  - ADEQUADO\n\
            \  - PARCIAL\n  - INADEQUADO\n\n- resumo executivo curto (máx. 5 linhas)\n\
            \nIMPORTANTE:\n- Seja técnico, objetivo e sucinto.\n- Não invente informações.\n\
            - Toda a análise deve ter no máximo 5000 tokens."
        - id: ec003384-e10d-424c-88e9-ab017cf0453c
          role: user
          text: '--------------------------

            CONTEXTO LEGAL E MODELO DO PCA

            {{#context#}}

            ---------------------------

            DFD ESTRUTURADO:

            {{#1776840847075.result_text#}}

            ---------------------------

            Analise tecnicamente o DFD com base:

            - na Lei 14.133/2021;

            - no modelo institucional STM de DFD PCA.


            Você deve analisar exclusivamente os campos do JSON estruturado fornecido.


            Considere um campo como preenchido quando houver conteúdo textual no valor
            do campo correspondente.


            Não reavalie o texto bruto do DFD.

            Não considerar como vazio um campo que possua conteúdo no JSON estruturado.


            REGRA DE INTERPRETAÇÃO DO DFD:


            Considere que os campos do DFD podem estar estruturados da seguinte forma:


            "TÍTULO DO CAMPO:"

            conteúdo na linha seguinte


            Exemplo:

            "OBJETO DA CONTRATAÇÃO:"

            "Aquisição de suprimentos..."


            Neste caso:

            - o campo DEVE ser considerado preenchido;

            - o conteúdo imediatamente abaixo pertence ao campo;

            - não classificar como vazio se houver texto subsequente antes do próximo
            item numerado.


            Somente classificar como não preenchido se:

            - não houver conteúdo após o título;

            - ou o conteúdo for irrelevante (ex: "a definir", "xxx", etc).


            Para cada campo obrigatório do modelo STM, verifique:

            - se está preenchido;

            - se está claro;

            - se está coerente;

            - se atende à finalidade da contratação.


            Itens mínimos:

            1. ID da contratação

            2. Objeto da contratação

            3. Necessidade e justificativa

            4. Declarações (almoxarifado / contrato vigente)

            5. Quantidade a ser contratada

            6. Data prevista da contratação

            7. Previsão de data para início da prestação dos serviços ou recebimento
            do objeto

            8. Resultados esperados

            9. Identificação da área requisitante

            10. Alinhamento do planejamento estratégico

            11. Adequação orçamentária

            12. Encaminhamento ao Diretor-Geral

            13. Autorização do Diretor-Geral


            Para cada campo:

            - verificar existência

            - verificar preenchimento

            - verificar clareza


            Não escolher subconjuntos.

            Não omitir campos.


            Para cada inconsistência:

            - campo_afetado

            - problema identificado

            - gravidade (baixa/média/alta)

            - fundamento legal

            - divergência do modelo STM

            - orientação objetiva de preenchimento (como deve ser escrito / ajustado)


            Analise obrigatoriamente, nesta ordem:

            1. id_contratacao

            2. objeto_contratacao

            3. necessidade_justificativa

            4. declaracoes

            5. criterios_sustentabilidade_acessibilidade

            6. quantidade_contratada

            7. data_prevista_contratacao

            8. data_inicio_prestacao_ou_recebimento

            9. resultados_esperados

            10. area_requisitante

            11. alinhamento_planejamento_estrategico

            12. adequacao_orcamentaria

            13. equipe_planejamento

            14. encaminhamento_autorizacao


            Ao final:

            - classificação geral: ADEQUADO / PARCIAL / INADEQUADO

            - resumo executivo curto'
        selected: false
        structured_output:
          schema:
            additionalProperties: false
            properties:
              campos_ausentes_ou_nao_preenchidos:
                items:
                  type: string
                type: array
              classificacao_geral:
                enum:
                - ADEQUADO
                - PARCIAL
                - INADEQUADO
                type: string
              problemas_encontrados:
