    - data:
        code: "import json\nfrom typing import Any, Dict, List\n\n\ndef _normalize(data:\
          \ Any) -> Dict:\n    if isinstance(data, dict):\n        return data\n \
          \   if isinstance(data, str):\n        try:\n            loaded = json.loads(data)\n\
          \            return loaded if isinstance(loaded, dict) else {}\n       \
          \ except Exception:\n            return {}\n    return {}\n\n\ndef _safe_list(value:\
          \ Any) -> List:\n    return value if isinstance(value, list) else []\n\n\
          \ndef _safe_str(value: Any, default: str = \"N/A\") -> str:\n    if value\
          \ is None:\n        return default\n    if isinstance(value, str):\n   \
          \     value = value.strip()\n        return value if value else default\n\
          \    return str(value)\n\n\ndef main(arg1, arg2=None) -> dict:\n    auditoria\
          \ = _normalize(arg1)\n    analise = _normalize(arg2)\n\n    riscos = _safe_list(auditoria.get(\"\
          riscos\", []))\n    nivel_geral = _safe_str(auditoria.get(\"nivel_risco_geral\"\
          , \"N/A\"))\n\n    campos_ausentes = _safe_list(analise.get(\"campos_ausentes_ou_nao_preenchidos\"\
          , []))\n    problemas = _safe_list(analise.get(\"problemas_encontrados\"\
          , []))\n    classificacao_geral = _safe_str(analise.get(\"classificacao_geral\"\
          , \"N/A\"))\n    resumo_executivo = _safe_str(analise.get(\"resumo_executivo\"\
          , \"\"))\n\n    linhas = []\n    linhas.append(f\"Classificação geral do\
          \ DFD: {classificacao_geral}\")\n    linhas.append(f\"Nível de risco geral:\
          \ {nivel_geral}\")\n    linhas.append(f\"Quantidade de campos ausentes:\
          \ {len(campos_ausentes)}\")\n    linhas.append(f\"Quantidade de problemas\
          \ encontrados: {len(problemas)}\")\n    linhas.append(f\"Quantidade de riscos\
          \ identificados: {len(riscos)}\")\n\n    if resumo_executivo and resumo_executivo\
          \ != \"N/A\":\n        linhas.append(\"\")\n        linhas.append(\"Resumo\
          \ executivo:\")\n        linhas.append(resumo_executivo)\n\n    if campos_ausentes:\n\
          \        linhas.append(\"\")\n        linhas.append(\"Campos ausentes ou\
          \ não preenchidos:\")\n        for campo in campos_ausentes[:10]:\n    \
          \        linhas.append(f\"- {_safe_str(campo)}\")\n\n    if problemas:\n\
          \        linhas.append(\"\")\n        linhas.append(\"Principais problemas\
          \ e orientações:\")\n        for i, p in enumerate(problemas[:5], 1):\n\
          \            linhas.append(\n                f\"{i}. Campo: {_safe_str(p.get('campo_afetado'))}\
          \ | \"\n                f\"Gravidade: {_safe_str(p.get('gravidade'))} |\
          \ \"\n                f\"Problema: {_safe_str(p.get('descricao_problema'))}\
          \ | \"\n                f\"Orientação: {_safe_str(p.get('orientacao_preenchimento'))}\"\
          \n            )\n\n    if riscos:\n        linhas.append(\"\")\n       \
          \ linhas.append(\"Principais riscos:\")\n        for i, r in enumerate(riscos[:5],\
          \ 1):\n            linhas.append(\n                f\"{i}. Campo: {_safe_str(r.get('campo_relacionado'))}\
          \ | \"\n                f\"Tipo: {_safe_str(r.get('tipo_risco'))} | \"\n\
          \                f\"Nível: {_safe_str(r.get('nivel'))} | \"\n          \
          \      f\"Consequência: {_safe_str(r.get('consequencia'))} | \"\n      \
          \          f\"Prioridade: {_safe_str(r.get('prioridade_correcao'))}\"\n\
          \            )\n\n    contexto_email = \"\\n\".join(linhas)\n\n    documents\
          \ = [\n        {\n            \"title\": \"Contexto consolidado para email\"\
          ,\n            \"content\": contexto_email,\n            \"metadata\": {\n\
          \                \"classificacao_geral\": classificacao_geral,\n       \
          \         \"nivel_risco_geral\": nivel_geral,\n                \"quantidade_campos_ausentes\"\
          : len(campos_ausentes),\n                \"quantidade_problemas\": len(problemas),\n\
          \                \"quantidade_riscos\": len(riscos)\n            }\n   \
          \     }\n    ]\n\n    return {\n        \"context\": documents\n    }"
        code_language: python3
