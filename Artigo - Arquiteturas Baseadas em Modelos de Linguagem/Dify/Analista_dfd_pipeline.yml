                      - ALTO
                      type: string
                    prioridade_correcao:
                      enum:
                      - imediata
                      - alta
                      - media
                      - baixa
                      type: string
                    tipo_risco:
                      type: string
                  required:
                  - campo_relacionado
                  - tipo_risco
                  - nivel
                  - descricao
                  - fundamento_legal
                  - consequencia
                  - prioridade_correcao
                  type: object
                type: array
            required:
            - riscos
            - nivel_risco_geral
            type: object
