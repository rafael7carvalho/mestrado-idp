    - data:
        code: "import re\nimport json\nfrom typing import Dict, List\n\n\ndef normalizar_texto(texto:\
          \ str) -> str:\n    if not texto:\n        return \"\"\n    texto = texto.replace(\"\
          \\r\\n\", \"\\n\").replace(\"\\r\", \"\\n\")\n    texto = re.sub(r\"[ \\\
          t]+\", \" \", texto)\n    texto = re.sub(r\"\\n{3,}\", \"\\n\\n\", texto)\n\
          \    return texto.strip()\n\n\ndef limpar_conteudo(conteudo: str) -> str:\n\
          \    if not conteudo:\n        return \"\"\n    conteudo = conteudo.strip(\"\
          \ :\\n\\t-\")\n    conteudo = re.sub(r\"\\n{2,}\", \"\\n\", conteudo)\n\
          \    return conteudo.strip()\n\n\ndef encontrar_secao(texto: str, padrao_inicio:\
          \ str, proximos_padroes: List[str]) -> str:\n    flags = re.IGNORECASE |\
          \ re.MULTILINE | re.DOTALL\n\n    match_inicio = re.search(padrao_inicio,\
          \ texto, flags)\n    if not match_inicio:\n        return \"\"\n\n    inicio\
          \ = match_inicio.end()\n    trecho_restante = texto[inicio:]\n\n    candidatos_fim\
          \ = []\n    for padrao in proximos_padroes:\n        m = re.search(padrao,\
          \ trecho_restante, flags)\n        if m:\n            candidatos_fim.append(m.start())\n\
          \n    if candidatos_fim:\n        fim_relativo = min(candidatos_fim)\n \
          \       conteudo = trecho_restante[:fim_relativo]\n    else:\n        conteudo\
          \ = trecho_restante\n\n    return limpar_conteudo(conteudo)\n\n\ndef main(arg1:\
          \ str, arg2=None) -> Dict:\n    texto = normalizar_texto(arg1)\n\n    padroes\
          \ = {\n        \"id_contratacao\": r\"(?:^|\\n)\\s*1\\.?\\s*ID\\s+DA\\s+CONTRATA[CÇ][AÃ]O\\\
          s*:\\s*\",\n        \"objeto_contratacao\": r\"(?:^|\\n)\\s*2\\.?\\s*OBJETO\\\
          s+DA\\s+CONTRATA[CÇ][AÃ]O\\s*:\\s*\",\n        \"necessidade_justificativa\"\
          : r\"(?:^|\\n)\\s*3\\.?\\s*NECESSIDADE\\s+E\\s+JUSTIFICATIVA\\s*:\\s*\"\
          ,\n        \"declaracoes\": r\"(?:^|\\n)\\s*4\\.?\\s*DECLARA[CÇ][OÕ]ES?.*?:\\\
          s*\",\n        \"criterios_sustentabilidade_acessibilidade\": r\"(?:^|\\\
          n)\\s*5\\.?\\s*(?:CRIT[EÉ]RIOS?.*SUSTENTABILIDADE.*ACESSIBILIDADE|SUSTENTABILIDADE.*ACESSIBILIDADE)\\\
          s*:\\s*\",\n        \"quantidade_contratada\": r\"(?:^|\\n)\\s*6\\.?\\s*QUANTIDADE.*?:\\\
          s*\",\n        \"data_prevista_contratacao\": r\"(?:^|\\n)\\s*7\\.?\\s*DATA\\\
          s+PREVISTA\\s+DA\\s+CONTRATA[CÇ][AÃ]O\\s*:\\s*\",\n        \"data_inicio_prestacao_ou_recebimento\"\
          : r\"(?:^|\\n)\\s*8\\.?\\s*DATA\\s+DE\\s+IN[IÍ]CIO.*?(?:PRESTA[CÇ][AÃ]O|RECEBIMENTO).*?:\\\
          s*\",\n        \"resultados_esperados\": r\"(?:^|\\n)\\s*9\\.?\\s*RESULTADOS\\\
          s+ESPERADOS\\s*:\\s*\",\n        \"area_requisitante\": r\"(?:^|\\n)\\s*10\\\
          .?\\s*[ÁA]REA\\s+REQUISITANTE\\s*:\\s*\",\n        \"alinhamento_planejamento_estrategico\"\
          : r\"(?:^|\\n)\\s*11\\.?\\s*ALINHAMENTO.*PLANEJAMENTO.*ESTRAT[EÉ]GICO\\\
          s*:\\s*\",\n        \"adequacao_orcamentaria\": r\"(?:^|\\n)\\s*12\\.?\\\
          s*ADEQUA[CÇ][AÃ]O\\s+OR[CÇ]AMENT[ÁA]RIA\\s*:\\s*\",\n        \"equipe_planejamento\"\
          : r\"(?:^|\\n)\\s*13\\.?\\s*EQUIPE\\s+DE\\s+PLANEJAMENTO\\s*:\\s*\",\n \
          \       \"encaminhamento_autorizacao\": r\"(?:^|\\n)\\s*14\\.?\\s*(?:ENCAMINHAMENTO|AUTORIZA[CÇ][AÃ]O|ENCAMINHAMENTO\\\
          s*/\\s*AUTORIZA[CÇ][AÃ]O)\\s*:\\s*\",\n    }\n\n    ordem = list(padroes.keys())\n\
          \    resultado = {}\n\n    for i, chave in enumerate(ordem):\n        padrao_inicio\
          \ = padroes[chave]\n        proximos = [padroes[k] for k in ordem[i + 1:]]\n\
          \        resultado[chave] = encontrar_secao(texto, padrao_inicio, proximos)\n\
          \n    campos_nao_identificados = [chave for chave, valor in resultado.items()\
          \ if not valor]\n\n    resultado_final = {\n        **resultado,\n     \
          \   \"campos_nao_identificados\": campos_nao_identificados\n    }\n\n  \
          \  return {\n        \"result_obj\": resultado_final,\n        \"result_text\"\
          : json.dumps(resultado_final, ensure_ascii=False, indent=2)\n    }"
